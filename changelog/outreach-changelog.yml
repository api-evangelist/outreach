notes: >-
  Outreach publishes no single unified API changelog. Change history is split across two dated surfaces: the
  REST API's "Deprecated features" page, which carries only breaking/behaviour changes, and the Data Sharing
  "Release notes" page, which carries schema additions to the shared data model. Additive REST API changes
  (new resources, new attributes) are not announced on either page. Both surfaces are captured below.
surfaces:
- name: REST API deprecated features
  url: https://developers.outreach.io/api/deprecated-features
  covers: breaking and behaviour changes only
- name: Data Sharing release notes
  url: https://developers.outreach.io/data-sharing/release-notes
  covers: additive schema changes to the Snowflake / Delta Sharing data model
- name: MCP server documentation
  url: https://developers.outreach.io/mcp-server
  covers: undated — tool catalog is versioned only by the count in the page heading
gaps:
- No RSS/Atom feed or machine-readable changelog is published for either surface.
- No dated changelog exists for additive REST API changes; new resources appear in the OpenAPI without a
  notice.
- The Tool Catalog page heading says "41 tools" while the overview page and Authentication page both say
  "32 tools" and "all 32 tools" — the MCP surface is self-inconsistent as published on 2026-08-13.
