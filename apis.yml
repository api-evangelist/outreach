aid: outreach
url: https://raw.githubusercontent.com/api-evangelist/outreach/refs/heads/main/apis.yml
name: Outreach
kind: company
description: >-
  Outreach is a sales execution and revenue platform for go-to-market teams, unifying email, calling, social
  and meetings into sequenced outbound motions with AI agents layered on top. Its public developer surface is
  a JSON API 1.0 REST API at api.outreach.io/api/v2 covering accounts, prospects, opportunities, sequences,
  sequence states, mailings, calls, tasks, teams, users, imports and webhooks across 51 tagged resources and
  253 operations, authorized by OAuth 2.0 with a scope-per-resource permission model and a separate
  server-to-server JWT token for unattended integrations. Outreach also runs a remote Model Context Protocol
  server at api.outreach.io/mcp with 41 tools, authorized by OAuth 2.1 with PKCE and Dynamic Client
  Registration, plus a client extensibility SDK for embedding web widgets inside the Outreach app, an
  event-driven webhook surface with HMAC-signed deliveries, and Outreach Data Sharing over Snowflake and
  Delta Sharing.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: paid
  onboarding: sales
  trial: false
  try_now: false
  public: false
  label: Sales-gated
  confidence: high
  source:
  - https://www.outreach.ai/pricing
  generated: '2026-08-13'
  method: searched
  note: Four published plan tiers (Amplify Essentials, Core, Plus, Pro) with published API-call and AI-credit
    entitlements but no published prices — every tier is contact-sales.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/outreach.png
tags:
- Sales
- Sales Engagement
- Sequences
- CRM
- Email
- Revenue Operations
- Sales Execution
- Prospecting
- Agents
- MCP
created: '2026-05-08'
modified: '2026-08-13'
specificationVersion: '0.23'
apis:
- name: Outreach MCP Server
  description: >-
    Remote Model Context Protocol server exposing Outreach as 41 agent tools (27 read, 11 write, 3 schema
    introspection) over streamable HTTP, authorized by OAuth 2.1 with PKCE and RFC 7591 Dynamic Client
    Registration. Tool permissions inherit the authenticated Outreach user's RBAC profile and every call
    is attributed to that user in Outreach activity history.
  humanURL: https://developers.outreach.io/mcp-server
  baseURL: https://api.outreach.io/mcp
  tags:
  - MCP
  - Agents
  - Sales Engagement
  properties:
  - type: Documentation
    url: https://developers.outreach.io/mcp-server
  - type: MCPServer
    url: mcp/outreach-mcp.yml
  - type: ToolCrosswalk
    url: mcp/outreach-tool-crosswalk.yml
- name: Outreach Client Extensions API
  description: >-
    Client extensibility surface for embedding a web application inside the Outreach client — shell, tab
    and tile web-widget extensions, a text-editor extension, activity-feed custom events and a mailing-links
    custom tracker — brokered by the @getoutreach/extensibility-sdk JavaScript SDK, which resolves an
    OutreachContext carrying user, org, account, prospect and opportunity data into the hosted iframe.
  humanURL: https://developers.outreach.io/client-extensions
  baseURL: https://api.outreach.io
  tags:
  - Extensions
  - UI
  properties:
  - type: Documentation
    url: https://developers.outreach.io/client-extensions
  - type: Components
    url: components/outreach-components.yml
- name: Outreach Data Sharing
  description: >-
    Read-only access to an organization's Outreach data through Snowflake secure data sharing and Delta
    Sharing, in a ready-to-query format with no data copy or custom pipeline. Roughly 60 documented tables
    covering accounts, prospects, opportunities, sequences, calls, mailings, meetings, Kaia meeting intelligence,
    forecasts and funnel insights.
  humanURL: https://developers.outreach.io/data-sharing
  baseURL: https://api.outreach.io
  tags:
  - Data Sharing
  - Integration
  - Analytics
  properties:
  - type: Documentation
    url: https://developers.outreach.io/data-sharing
  - type: ChangeLog
    url: https://developers.outreach.io/data-sharing/release-notes
- name: Outreach Webhooks
  description: >-
    Event-driven webhook deliveries for accounts, calls, contacts, email addresses, imports, Kaia recordings,
    mailings, opportunities, opportunity prospect roles, prospects, sequences, sequence states, tasks
    and users. Subscribers register HTTPS endpoints via POST /api/v2/webhooks and receive JSON:API style
    payloads with HMAC signature verification.
  humanURL: https://developers.outreach.io/api/webhooks/
  baseURL: https://api.outreach.io/api/v2
  tags:
  - Webhook
  - Event
  - Sales Engagement
  tags_raw:
  - Webhooks
  - Events
  - Sales Engagement
  properties:
  - type: Documentation
    url: https://developers.outreach.io/api/webhooks/
  - type: AsyncAPI
    url: webhooks/outreach-webhooks-asyncapi.yml
  - type: Webhooks
    url: webhooks/outreach-webhooks-asyncapi.yml
