- name: Outreach MCP Server
  description: >-
    Remote Model Context Protocol server exposing Outreach as 41 agent tools (27 read, 11 write, 3 schema
    introspection) over streamable HTTP, authorized by OAuth 2.1 with PKCE and RFC 7591 Dynamic Client
    Registration. Tool permissions inherit the authenticated Outreach user's RBAC profile and every call is
    attributed to that user in Outreach activity history.
  humanURL: https://developers.outreach.io/mcp-server
  baseURL: https://api.outreach.io/mcp
  tags:
  - MCP
  - Agents
  - Sales Engagement
  properties:
  - type: Documentation
    url: https://developers.outreach.io/mcp-server
  - type: MCPServer
    url: mcp/outreach-mcp.yml
  - type: ToolCrosswalk
    url: mcp/outreach-tool-crosswalk.yml
- name: Outreach Client Extensions API
  description: >-
    Client extensibility surface for embedding a web application inside the Outreach client — shell, tab and
    tile web-widget extensions, a text-editor extension, activity-feed custom events and a mailing-links
    custom tracker — brokered by the @getoutreach/extensibility-sdk JavaScript SDK, which resolves an
    OutreachContext carrying user, org, account, prospect and opportunity data into the hosted iframe.
  humanURL: https://developers.outreach.io/client-extensions
  baseURL: https://api.outreach.io
  tags:
  - Extensions
  - UI
  properties:
  - type: Documentation
    url: https://developers.outreach.io/client-extensions
  - type: Components
    url: components/outreach-components.yml
- name: Outreach Data Sharing
  description: >-
    Read-only access to an organization's Outreach data through Snowflake secure data sharing and Delta
    Sharing, in a ready-to-query format with no data copy or custom pipeline. Roughly 60 documented tables
    covering accounts, prospects, opportunities, sequences, calls, mailings, meetings, Kaia meeting
    intelligence, forecasts and funnel insights.
  humanURL: https://developers.outreach.io/data-sharing
  baseURL: https://api.outreach.io
  tags:
  - Data Sharing
  - Integration
  - Analytics
  properties:
  - type: Documentation
    url: https://developers.outreach.io/data-sharing
  - type: ChangeLog
    url: https://developers.outreach.io/data-sharing/release-notes
- name: Outreach Webhooks
  description: >-
    Event-driven webhook deliveries for accounts, calls, contacts, email addresses, imports, Kaia recordings,
    mailings, opportunities, opportunity prospect roles, prospects, sequences, sequence states, tasks and
    users. Subscribers register HTTPS endpoints via POST /api/v2/webhooks and receive JSON:API style payloads
    with HMAC signature verification.
  humanURL: https://developers.outreach.io/api/webhooks/
  baseURL: https://api.outreach.io/api/v2
  tags:
  - Webhooks
  - Events
  - Sales Engagement
  properties:
