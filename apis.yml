- name: Outreach REST API
  description: >-
    JSON API 1.0 REST API covering accounts, prospects, opportunities, sequences, sequence states, mailings,
    calls, tasks, teams, users, notes, imports, batch actions and webhooks — 147 paths and 253 operations
    over 51 tagged resources, authorized by OAuth 2.0 bearer token or a server-to-server JWT.
