# Generated by API Evangelist. Our phrasing, not observed demand (roadmap#949, pilot).
# Conversational phrasing for an INTEGRATION: the language business stakeholders use for what this
# workflow gets done. Same x-apievangelist-phrasing shape as the per-operation overlays, plus what only
# an integration has: the roles who ask for it, the outcome, and the two capabilities it connects.
# Every {slot} is an input of the workflow; the capabilities come from outreach-integration-map.yml.
overlay: 1.0.0
info:
  title: API Evangelist conversational phrasing for the Google Sheets + Outreach prospect sequencing integration
  version: 1.0.0
extends: integrations/outreach-google-sheets-sheet-rows.yml
actions:
  - target: $.workflows[?(@.workflowId == 'sheet-rows-to-outreach-prospect')]
    update:
      x-apievangelist-phrasing:
        intent: Turn Google Sheets rows into Outreach prospects in a sequence
        outcome: Contacts listed in a spreadsheet become Outreach prospects and start a sales sequence, without manual entry.
