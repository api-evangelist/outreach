          - text: "Add the contacts in range {range} of spreadsheet {spreadsheetId} to Outreach sequence {sequenceId}."
          - text: "Create Outreach prospects from spreadsheet {spreadsheetId} range {range} and send from mailbox {mailboxId}."
          - text: "Enroll the people in sheet {spreadsheetId} in sequence {sequenceId} using mailbox {mailboxId}."
        method: generated
