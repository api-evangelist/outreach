arazzo: 1.0.1
info:
  title: Airtable records to Outreach prospects in a sequence
  version: 1.0.0
  description: Lists records from an Airtable table and creates each as an Outreach prospect enrolled in a sequence (Zapier lists Airtable with Outreach triggers and actions).
sourceDescriptions:
- name: partner
  url: https://raw.githubusercontent.com/api-evangelist/airtable/refs/heads/main/openapi/airtable-records-api-openapi.yml
  type: openapi
- name: outreachProspects
  url: https://raw.githubusercontent.com/api-evangelist/outreach/refs/heads/main/openapi/outreach-prospect-api-openapi.yml
  type: openapi
- name: outreachSequenceStates
  url: https://raw.githubusercontent.com/api-evangelist/outreach/refs/heads/main/openapi/outreach-sequence-state-api-openapi.yml
  type: openapi
workflows:
- workflowId: records-to-outreach-prospect
  summary: Airtable records to Outreach prospects in a sequence
  inputs:
    type: object
    properties:
      baseId:
        type: string
      tableIdOrName:
        type: string
      sequenceId:
        type: integer
      mailboxId:
        type: integer
  steps:
  - stepId: readPartner
    operationId: $sourceDescriptions.partner.listRecords
    parameters:
    - name: baseId
      in: path
      value: $inputs.baseId
    - name: tableIdOrName
      in: path
      value: $inputs.tableIdOrName
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      email: $response.body#/records/0/fields/Email
      firstName: $response.body#/records/0/fields/First Name
      lastName: $response.body#/records/0/fields/Last Name
  - stepId: createProspect
    operationId: $sourceDescriptions.outreachProspects.postProspects
    requestBody:
      contentType: application/vnd.api+json
      payload:
        data:
          type: prospect
          attributes:
            emails:
            - $steps.readPartner.outputs.email
            firstName: $steps.readPartner.outputs.firstName
            lastName: $steps.readPartner.outputs.lastName
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      prospectId: $response.body#/data/id
  - stepId: addToSequence
    operationId: $sourceDescriptions.outreachSequenceStates.postSequenceStates
    requestBody:
      contentType: application/vnd.api+json
      payload:
        data:
          type: sequenceState
          relationships:
            prospect:
              data:
                type: prospect
                id: $steps.createProspect.outputs.prospectId
            sequence:
              data:
                type: sequence
                id: $inputs.sequenceId
            mailbox:
              data:
                type: mailbox
                id: $inputs.mailboxId
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      sequenceStateId: $response.body#/data/id
x-integration:
  partner: airtable
  edge_evidence: https://zapier.com/apps/outreach/integrations
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: enrichment pass local-v5 (Claude)
  guessed_steps:
  - step: readPartner
    cause: partner-contract
    why: Airtable field names are user-defined per table.
  - step: createProspect
    cause: provider-contract
    why: The Outreach prospect spec does not fully constrain the JSON:API attributes payload; emails/firstName/lastName names follow the Outreach docs object, not a required schema.
