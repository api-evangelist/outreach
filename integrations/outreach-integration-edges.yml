skips:
- label: Attio
  cause: catalog
  why: Zapier names Attio with no published Outreach template; deferred to the 8-per-run cap after four template-backed
    flows.
- label: Notion
  cause: catalog
  why: No named Outreach template on Zapier; deferred.
- label: LinkedIn
  cause: partner-contract
  why: LinkedIn member/profile data is not exposed as a public lead source in its spec; Zapier template uses LinkedIn
    Ads lead-gen forms.
- label: LinkedIn Ads
  cause: partner-contract
  why: The linkedin-ads specs in the catalog hold no lead-gen form response operation.
- label: Microsoft Dynamics CRM
  cause: catalog
