  note: >-
    Outreach ships exactly one current first-party client library, and it is not a REST API SDK — it is the
    browser-side Client Extensibility SDK that a web-widget extension uses to talk to the Outreach host
    application. There is no first-party server SDK for the REST API in any language: npm, PyPI, RubyGems,
    Packagist, crates.io, NuGet and Maven Central were all checked and carry no Outreach-published client.
    Integrators are expected to call the JSON:API surface directly, or use the MCP server.
