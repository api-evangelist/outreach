openapi: 3.2.0
info:
  description: Outreach Public API is documented here, at the Development Portal, expand the link Outreach REST API Reference in the left navigation bar to see human-readable description of endpoints and data types.
  title: Outreach REST API Reference Kaia Recording API
  version: ''
servers:
- url: https://api.outreach.io/api/v2
security:
- bearerAuth: []
tags:
- description: '## Kaia Recording Relationships


    ## ⌵ Kaia Recording Actions'
  name: Kaia Recording
  x-internal: false
paths:
  /kaiaRecordings:
    get:
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/kaiaRecordingResponse'
                    type: array
          description: OK
        '422':
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        detail:
                          type: string
                        id:
                          type: string
                        title:
                          type: string
                      type: object
                    type: array
          description: JSON error message
      summary: Get a Collection of Kaia Recordings
      tags:
      - Kaia Recording
      x-internal: false
      operationId: getKaiaRecordings
      x-operation-id-source: derived
  /kaiaRecordings/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/kaiaRecordingResponse'
          description: OK
        '404':
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        detail:
                          type: string
                        id:
                          type: string
                        title:
                          type: string
                      type: object
                    type: array
          description: Not Found
      summary: Get a Kaia Recording by ID
      tags:
      - Kaia Recording
      x-internal: false
      operationId: getKaiaRecordingsById
      x-operation-id-source: derived
components:
  schemas:
    kaiaRecording:
      description: ''
      properties:
        botInMeetingSeconds:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg>


            Time the recording bot spent in the meeting, in seconds (calculated from endTime - startTime)'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        createdAt:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg> <img src=https://developers.outreach.io/badges/sortable.svg>


            The creation timestamp of the recording (ISO 8601)'
          format: date-time
          type:
          - string
          - 'null'
          x-internal: false
        endTime:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg> <img src=https://developers.outreach.io/badges/sortable.svg>


            The end time of the recording (ISO 8601)'
          format: date-time
          type:
          - string
          - 'null'
          x-internal: false
        format:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg>


            The recording format: meeting or call'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        host:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            Meeting host/organizer with full participant info'
          type:
          - object
          - 'null'
          x-internal: false
        instanceId:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg>


            The unique instance identifier (UUID) for the recording'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        mediaDurationSeconds:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg>


            Actual media duration in seconds, extracted from the video file. Null if unavailable.'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        participantCount:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            The number of participants in the recording'
          type:
          - integer
          - 'null'
          x-internal: false
        participants:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            Polymorphic array of meeting participants with type (user/prospect/external), id, displayName, etc.'
          items:
            type: object
          type:
          - array
          - 'null'
          x-internal: false
        provider:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg>


            The meeting provider (zoom, teams, etc.)'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        recordingUrl:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            URL to view the recording'
          maxLength: 2048
          type:
          - string
          - 'null'
          x-internal: false
        sourceId:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg>


            Source ID from originating system. format=call: Call ID for /api/v2/calls. format=meeting: calendar event ID.'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        startTime:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg> <img src=https://developers.outreach.io/badges/sortable.svg>


            The start time of the recording (ISO 8601)'
          format: date-time
          type:
          - string
          - 'null'
          x-internal: false
        state:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg>


            Recording state: UNKNOWN, CREATED, STARTED, ENDED, DROPPED, or DELETED'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        title:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            Recording title (may be null for untitled meetings)'
          maxLength: 65535
          type:
          - string
          - 'null'
          x-internal: false
        topics:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            Aggregated topics discussed in the recording. Hidden by default; request explicitly.'
          items:
            type: object
          type:
          - array
          - 'null'
          x-internal: false
        transcriptUrl:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            Self-authenticating URL to fetch transcript JSON (2-hour expiry). Hidden field.'
          maxLength: 4096
          type:
          - string
          - 'null'
          x-internal: false
        updatedAt:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg> <img src=https://developers.outreach.io/badges/sortable.svg>


            The last update timestamp (ISO 8601). Use for incremental sync with filter[updatedAt]>='
          format: date-time
          type:
          - string
          - 'null'
          x-internal: false
      type: object
      x-internal: false
    kaiaRecordingRelationships:
      properties:
        account:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            The account associated with the recording'
          properties:
            links:
              properties:
                related:
                  format: uri
                  type: string
              type: object
        opportunity:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            The opportunity associated with the recording'
          properties:
            links:
              properties:
                related:
                  format: uri
                  type: string
              type: object
        owner:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            The recording owner/organizer'
          properties:
            links:
              properties:
                related:
                  format: uri
                  type: string
              type: object
      type: object
    kaiaRecordingResponse:
      properties:
        attributes:
          $ref: '#/components/schemas/kaiaRecording'
        id:
          type: integer
        relationships:
          $ref: '#/components/schemas/kaiaRecordingRelationships'
        type:
          type: string
      type: object
      x-internal: false
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    s2sAuthToken:
      bearerFormat: JWT
      scheme: bearer
      type: http
