              schema:
                properties:
                  data:
                    properties:
                      attributes:
                        $ref: '#/components/schemas/prospectNote'
                      id:
                        type: integer
                      relationships:
                        $ref: '#/components/schemas/prospectNoteRelationships'
                      type:
                        type: string
                    required:
                    - type
                    - id
                type: object
          description: OK
        '422':
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        detail:
                          type: string
                        id:
                          type: string
                        title:
                          type: string
                      type: object
                    type: array
          description: JSON error message
      summary: Update a Prospect Note
      tags:
      - Prospect Note
      x-internal: false
components:
  schemas:
    prospectNoteResponse:
      properties:
        attributes:
          $ref: '#/components/schemas/prospectNote'
        id:
          type: integer
        relationships:
          $ref: '#/components/schemas/prospectNoteRelationships'
        type:
          type: string
      type: object
      x-internal: false
    prospectNote:
      description: 'Notes related to prospects

        '
      properties:
        createdAt:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg> <img src=https://developers.outreach.io/badges/filterable.svg> <img src=https://developers.outreach.io/badges/sortable.svg>


            The date and time the prospect note was created.'
          format: date-time
          type:
          - string
          - 'null'
          x-internal: false
        message:
          description: '


            The text content of this prospect note.'
          maxLength: 65535
          type:
          - string
          - 'null'
          x-internal: false
        noteType:
          description: '


            The context of this prospect note, one of {note,call,coffee,beer,meeting}.'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        opportunityAssociationRule:
          description: '<img src=https://developers.outreach.io/badges/writeonly.svg>


            The rule used to associate the account note with an opportunity, one of {recent_created,recent_updated}.'
          maxLength: 255
          type:
          - string
          - 'null'
          x-internal: false
        pinned:
          description: '


            A boolean value indicating whether this prospect note is pinned.'
          type:
          - boolean
          - 'null'
          x-internal: false
      type: object
      x-internal: false
    prospectNoteRelationships:
      properties:
        creator:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            The creator of the prospect note. Relationship creator cannot be used as a filter.'
          properties:
            data:
              properties:
                id:
                  type: integer
                type:
                  enum:
                  - user
                  type: string
              type:
              - object
              - 'null'
            links:
              properties:
                related:
                  format: uri
                  type: string
              type: object
        opportunity:
          description: '<img src=https://developers.outreach.io/badges/readonly.svg>


            The opportunity this prospect note is related to. Relationship opportunity cannot be used as a filter.'
          properties:
            data:
              properties:
                id:
                  type: integer
                type:
                  enum:
                  - opportunity
                  type: string
              type:
              - object
              - 'null'
            links:
              properties:
                related:
                  format: uri
                  type: string
              type: object
        prospect:
          description: The prospect this prospect note is related to. You can use only the attribute id to filter prospectNotes by prospect (e.g. filter[prospect][id]=X).
          properties:
            data:
              properties:
                id:
                  type: integer
                type:
                  enum:
                  - prospect
                  type: string
              type:
              - object
              - 'null'
            links:
              properties:
                related:
                  format: uri
                  type: string
              type: object
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    s2sAuthToken:
      bearerFormat: JWT
      scheme: bearer
      type: http
