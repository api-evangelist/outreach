          content:
            application/vnd.api+json: {}
          description: Deleted
        '422':
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        detail:
                          type: string
                        id:
                          type: string
                        title:
                          type: string
                      type: object
                    type: array
          description: JSON error message
      summary: Delete an Existing Prospect Note by ID
      tags:
      - Prospect Note
      x-internal: false
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
