      requestBody:
        content:
          application/vnd.api+json:
            schema:
              properties:
                data:
                  properties:
                    attributes:
                      $ref: '#/components/schemas/prospectNote'
                    id:
                      type: integer
                    relationships:
                      $ref: '#/components/schemas/prospectNoteRelationships'
                    type:
                      type: string
                  required:
