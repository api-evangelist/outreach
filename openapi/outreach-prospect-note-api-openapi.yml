                    items:
                      $ref: '#/components/schemas/prospectNoteResponse'
                    type: array
          description: OK
        '422':
          content:
            application/vnd.api+json:
              schema:
                properties:
                  errors:
                    items:
                      properties:
                        detail:
                          type: string
                        id:
                          type: string
                        title:
                          type: string
                      type: object
                    type: array
          description: JSON error message
      summary: Get a Collection of Prospect Notes
      tags:
      - Prospect Note
      x-internal: false
    post:
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              properties:
                data:
                  properties:
                    attributes:
                      $ref: '#/components/schemas/prospectNote'
                    relationships:
                      $ref: '#/components/schemas/prospectNoteRelationships'
                    type:
                      type: string
              type: object
        required: true
      responses:
