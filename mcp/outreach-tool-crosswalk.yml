notes: >-
  Binds each published Outreach MCP tool to the REST operation(s) that back it. Two caveats govern every
  confidence value here. First, the Outreach OpenAPI declares NO operationId on any of its 253 operations,
  so REST operations are addressed by `METHOD /path` — the only stable identifier the contract offers.
  Second, `tools/list` on https://api.outreach.io/mcp is OAuth-gated (401), so tools were mapped from the
  published Tool Catalog by name and description rather than from live input schemas. Nothing below was
  invented: every REST path was grepped out of the saved spec and every tool name comes from Outreach's
  own catalog page.

