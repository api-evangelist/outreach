notes: Prices are gated behind a sales conversation; entitlements are not. The API-call allowance is a commercial quota distinct from the technical rate limit (10,000 requests/hour per user) recorded in
  rate-limits/outreach-rate-limits.yml — a caller can be inside the hourly rate limit and still exhaust the plan's annual call entitlement.
