description: >-
  Outreach publishes a four-tier plan ladder (Amplify Essentials, Core, Plus, Pro) on its pricing page. No
  per-seat dollar figure is published for any tier — every tier is "contact sales" — but Outreach DOES
  publish the quantitative entitlements attached to each tier, including the annual API call allowance, the
  AI credit allotment, the custom-object count and the knowledge-base size. Those entitlements are the part
  that matters to an API consumer, and they are captured verbatim below.
pricing_model: Hybrid — seat-based pricing combined with consumption-based pricing metered in AI credits.
  Additional credit packs are purchasable.
currency: USD
billing_period: not published
public_pricing: false
plan_count: 4
